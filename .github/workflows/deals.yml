# Каждый день обновляет горящие билеты из Новосибирска (assets/deals.json)
name: Горящие билеты

on:
  schedule:
    - cron: '7 21 * * *'   # 04:07 по Новосибирску
  workflow_dispatch:        # можно запустить вручную во вкладке Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Получить билеты
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 scripts/update_deals.py
      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add assets/deals.json
          git diff --cached --quiet || git commit -m "Горящие билеты: обновление $(date +%F)"
          git push
